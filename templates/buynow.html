<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Summary</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  font-family: Arial;
  background: url('../static/landing_page/images/ch1.jpeg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.container {
  max-width: 500px;
  margin-top: 50px;
  background: white;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 0 10px gray;
}

</style>
</head>

<body>

<div class="container">

  <h2 class="text-center mb-4">Order Summary</h2>

  <p><b>Product:</b> <span id="name"></span></p>
  <img id="productImg" style="width:100%; height:500px; object-fit:cover; border-radius:10px; margin-bottom:10px;">
  <p><b>Price:</b> ₹<span id="price"></span></p>

  <p>
    <b>Quantity:</b>
    <input type="number" id="qty" value="1" min="1" class="form-control w-25">
  </p>

  <p><b>Discount (10%):</b> ₹<span id="discount"></span></p>
  <p><b>Delivery Charges:</b> ₹<span id="delivery">50</span></p>

  <h4>Total: ₹<span id="total"></span></h4>

  <hr>

  <h5>Customer Details</h5>

  <input type="text" id="address" class="form-control mb-2" placeholder="Enter Address">
  <input type="email" id="email" class="form-control mb-2" placeholder="Enter Email">

  <button class="btn btn-success w-100" onclick="placeOrder()">Place Order</button>

</div>

<script>

// URL data get
let params = new URLSearchParams(window.location.search);

let name = params.get("name");
let price = params.get("price");
let img=params.get("img");

document.getElementById("name").innerText = name;
document.getElementById("price").innerText = price;
document.getElementById("productImg").src ="../static/landing_page/images/" + img;

function calculate() {
  let qty = document.getElementById("qty").value;
  let total = price * qty;

  let discount = total * 0.10;
  let finalTotal = total - discount + 50;

  document.getElementById("discount").innerText = discount;
  document.getElementById("total").innerText = finalTotal;
}

// run initially
calculate();

// update when qty changes
document.getElementById("qty").addEventListener("input", calculate);

function placeOrder() {

  let email = document.getElementById("email").value;
  let name = document.getElementById("name").innerText;
  let price = document.getElementById("price").innerText;
  let qty = document.getElementById("qty").value;
  let total = document.getElementById("total").innerText;
  let address = document.getElementById("address").value;

  fetch("/save-order/", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded",
      "X-CSRFToken": getCookie("csrftoken")
    },
    body: `name=${name}&price=${price}&qty=${qty}&total=${total}&address=${address}&email=${email}`
  })
  .then(res => res.json())
  .then(data => {
    alert("Order Saved Successfully ✅");

    // ✅ redirect AFTER success
    window.location.href = `/send-email?email=${email}&name=${name}`;
  })
  .catch(err => {
    alert("Error saving order ❌");
    console.log(err);
  });

}
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    let cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      let cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + "=")) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

</script>

</body>
</html>
