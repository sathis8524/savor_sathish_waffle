<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waffle Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:flex-end;   /* Moves login box to right */
    align-items:center;
    background: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.8)), url(../static/landing_page/images/bg1.jpeg);
}

/* Dark overlay */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    top:0;
    left:0;
}

.login-box{
    position:relative;
    width:350px;
    padding:40px;
    margin-right:60px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    background: rgba(0, 0, 0, 0.6); /* Text தெரிய வசதியாக சிறிய background */
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#2e7d32;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    font-size:14px;
    color:whitesmoke;
}

.input-group input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

.login-btn{
    width:100%;
    padding:10px;
    border:none;
    background:#2e7d32;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
    margin-top: 10px;
}

.login-btn:hover{
    background:#1b5e20;
}

.links{
    color: wheat;
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.links a{
    color:#4caf50;
    text-decoration:none;
}
.links a:hover{
    text-decoration:underline;
}

/* Responsive for mobile */
@media(max-width:768px){
    body{
        justify-content:center;
    }
    .login-box{
        margin-right:0;
        width:90%;
    }
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Login Page</h2>

    {% for i in messages %}
        {% if 'failed' in i.tags %}
            <h3 style="background-color: aliceblue; color: red; padding: 5px; text-align: center; font-size: 14px; border-radius: 4px;">{{i}}</h3>
        {% endif %}
    {% endfor %}

    <!-- Action URL-ல் முன்னால் '/' சேர்க்கப்பட்டுள்ளது மற்றும் method குறிப்பிடப்பட்டுள்ளது -->
    <form action="/customer_login_from_submission" method="POST">
        <!-- இடைவெளியுடன் CSRF Token -->
        {% csrf_token %}

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" name="email_id" class="form_control" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <!-- Submit Button (<a> tag இன்றி தனியாக மாற்றப்பட்டுள்ளது) -->
        <button type="submit" class="login-btn">Login</button>

        <div class="links">
            <p><a href="#">Forgot Password?</a></p>
            <!-- Django URL Mapping படி register இணைப்பு -->
            <p>Don't have an account? <a href="/register">Sign Up</a></p>
        </div>
    </form>
</div>

</body>
</html>
