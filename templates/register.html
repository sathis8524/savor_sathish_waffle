<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waffle</title>
    <link rel="stylesheet" href="../static/landing_page/css/register.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <section id="register" >
        <div class="register-box">
            <div class="row">
               
                <div class="col-lg-6 col-md-6">
                     <h2>Register</h2>
                     {% for i in messages%}
                     {% if 'already' in i.tags %}
                     <h3 style="background-color: aliceblue;">{{i}}</h3>
                     {% endif %}
                     {% endfor %}
                     <!-- sms -->
                     {% if success %}
                     <p style="color:green;">{{ success }}</p>
                     {% endif %}

                     {% if error %}
                     <p style="color:red;">{{ error }}</p>
                     {% endif %}
                    <form action="/register_account_form_submission" method="POST">
                       {%csrf_token%}
                       <div class="input-group">
                         <label for="fullname">Name</label>
                         <input type="text" id="fullname" name="full_name" class="form_control" placeholder="Full name" required>
                       </div> 

                       <div class="input-group">
                         <label for="email">Email Id</label>
                         <input type="email" id="email" name="email_id" class="form_control" placeholder="Enter your email" required>
                       </div>
                       
                       <div class="input-group">
                         <label for="phone">Phone Number</label>
                         <input type="tel" id="phone" name="phone_number" class="form_control" placeholder="Phone Number" required>
                       </div>

                        <div class="input-group">
                           <label for="gender">Gender</label>
                           <input type="text" id="othergender" name="other_gender" placeholder="Please specify"required>
                         </div>
                        

                       <div class="input-group">
                         <label>Password</label>
                         <input type="password" id="password" name="password" placeholder="Password" required>
                       </div>
                       
                     
                      <button type="submit" class="btn-singin">Register</button>
                      
                      <a href="{% url 'index' %}">Home</a>
                      <a href="/login">I have already login</a>
                    </form>
                    

                </div>
            </div>
        </div>
    </section>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script> 
</body>
</html>
